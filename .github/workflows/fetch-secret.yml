name: Fetch AWS Secret on PR

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  fetch-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::672491114190:role/test
          aws-region: us-east-1

      - name: Fetch secret from AWS Secrets Manager
        id: fetch-secret
        run: |
          SECRET_VALUE=$(aws secretsmanager get-secret-value \
            --secret-id arn:aws:secretsmanager:us-east-1:672491114190:secret:/playground/github-actions/test-ZxccUm \
            --query SecretString \
            --output text)
          echo "MY_SECRET=$SECRET_VALUE" >> "$GITHUB_ENV"

      - name: Echo the secret
        run: |
          echo "Secret value: $MY_SECRET"
